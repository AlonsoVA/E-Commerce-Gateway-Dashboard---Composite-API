server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
  tomcat:
    threads:
      max: 40

spring:
  application:
    name: ecommerce-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ecommerce_gateway}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.hbm2ddl.create_namespaces: true
      hibernate.jdbc.time_zone: America/Chihuahua
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 15s

app:
  internal-base-url: ${INTERNAL_BASE_URL:}
  currency:
    base-url: ${CURRENCY_BASE_URL:https://api.frankfurter.app}
    cache-ttl: 60s
  http:
    connect-timeout: 3s
    read-timeout: 5s

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    mx.edu.utch.dgs.gateway: INFO
